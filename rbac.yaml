apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-log-collector
---
# Grants read-only access to pods and pod logs within the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-log-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-log-collector
subjects:
  - kind: ServiceAccount
    name: k8s-log-collector
roleRef:
  kind: Role
  name: k8s-log-collector
  apiGroup: rbac.authorization.k8s.io
